<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 | SETUPOD</title>
  
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030206;
      --text-color: #ffffff;
      --accent: #a855f7;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
      background: linear-gradient(90deg, #fff, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
    }
    
    .error-code {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    
    p {
      color: rgba(255,255,255,0.6);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 400px;
    }
    
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-direction: column;
      width: 100%;
      max-width: 320px;
    }
    
    .btn {
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: #ffffff;
      color: #000000;
    }
    
    .btn-primary:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ffffff;
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }
    
    .claim-box {
      margin-top: 60px;
      padding: 20px;
      background: rgba(168,85,247,0.1);
      border: 1px solid rgba(168,85,247,0.2);
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
    }
    
    .claim-box h3 {
      font-size: 15px;
      color: #e9d5ff;
      margin-bottom: 8px;
    }
    
    .claim-box p {
      font-size: 13px;
      color: rgba(233,213,255,0.7);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="logo" onclick="location.href='/'">SETUPOD</div>
  
  <div class="error-code">404</div>
  <h1>존재하지 않는 명함입니다</h1>
  <p>입력하신 주소가 잘못되었거나,<br>명함 주인이 주소를 변경했을 수 있습니다.</p>
  
  <div class="action-buttons">
    <a href="/" class="btn btn-secondary">메인 홈페이지로 돌아가기</a>
  </div>
  
  <div class="claim-box">
    <h3>이 주소가 마음에 드시나요?</h3>
    <p>지금 바로 이 멋진 주소로 나만의 3D 디지털 명함을 무료로 만들어보세요.</p>
    <a href="/maker" class="btn btn-primary">내 명함 만들기 🚀</a>
  </div>

  <script>
    // 현재 URL의 slug를 추출하여 개인화된 메시지 렌더링 시도
    window.addEventListener('DOMContentLoaded', () => {
      const path = window.location.pathname.replace('/', '');
      if (path && path !== '404' && path !== '404.html') {
        const claimBox = document.querySelector('.claim-box h3');
        claimBox.innerHTML = `<span style="color:#fff; font-weight:800;">setupod.com/${path}</span><br>이 주소가 마음에 드시나요?`;
      }
    });
  </script>
</body>
</html>
