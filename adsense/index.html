<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 애드센스 일매출 & 트래픽 자산가치 계산기 | SETUPOD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="/js/maza-telemetry.js"></script>
  <script src="/js/lead-magnet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }
    .calc-card {
      width: 100%;
      max-width: 640px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 36px 30px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(245,158,11,0.12);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.4);
      border-radius: 9999px;
      color: #fbbf24;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; color: #fff; }
    p.sub { font-size: 13.5px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    @media (max-width: 500px) { .input-grid { grid-template-columns: 1fr; } }
    .input-box { display: flex; flex-direction: column; gap: 6px; }
    .input-box label { font-size: 12.5px; font-weight: 700; color: #cbd5e1; }
    .input-box input, .input-box select {
      padding: 13px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box input:focus, .input-box select:focus { border-color: #f59e0b; }
    .res-box {
      background: rgba(245,158,11,0.06);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 20px;
      padding: 22px;
      margin-top: 10px;
    }
    .res-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .res-row:last-child { margin-bottom: 0; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1); }
    .res-label { font-size: 13px; color: #94a3b8; font-weight: 600; }
    .res-val { font-size: 17px; font-weight: 900; color: #fff; }
    .res-val.highlight { color: #fbbf24; font-size: 22px; }
    .res-val.flippa { color: #34d399; font-size: 20px; }
    .btn-lead {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 22px;
      box-shadow: 0 6px 20px rgba(245,158,11,0.3);
      transition: all 0.2s;
    }
    .btn-lead:hover { filter: brightness(1.1); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="calc-card">
    <div class="badge">💰 BLOG AD REVENUE ENGINE</div>
    <h1>블로그 애드센스 일매출 & 자산가치 계산기</h1>
    <p class="sub">일일 방문자 수와 타겟 국가를 입력하면 예상 월수익과 Flippa 도메인 매각 가치를 1초 만에 산출합니다.</p>

    <div class="input-grid">
      <div class="input-box">
        <label>일일 방문자 수 (명/일)</label>
        <input type="number" id="inpVisitors" value="3000" min="100" step="100" oninput="calculate()">
      </div>
      <div class="input-box">
        <label>페이지뷰 비율 (PV/방문자)</label>
        <input type="number" id="inpPvRatio" value="1.8" min="1.0" max="5.0" step="0.1" oninput="calculate()">
      </div>
      <div class="input-box">
        <label>타겟 트래픽 국가 / 언어</label>
        <select id="inpCountry" onchange="calculate()">
          <option value="12.0">미국 / 캐나다 (Tier 1, eCPM $12)</option>
          <option value="8.5">영국 / 호주 / 서유럽 (eCPM $8.5)</option>
          <option value="4.2" selected>한국 / 일본 (Tier 2, eCPM $4.2)</option>
          <option value="1.8">동남아 / 글로벌 (Tier 3, eCPM $1.8)</option>
        </select>
      </div>
      <div class="input-box">
        <label>적용 환율 (원/$)</label>
        <input type="number" id="inpFxRate" value="1380" min="1000" step="10" oninput="calculate()">
      </div>
    </div>

    <div class="res-box">
      <div class="res-row">
        <span class="res-label">월간 총 페이지뷰 (PV)</span>
        <span class="res-val" id="outMonthlyPv">162,000 PV</span>
      </div>
      <div class="res-row">
        <span class="res-label">예상 일일 수익</span>
        <span class="res-val" id="outDailyRevenue">$22.68 (약 31,300원)</span>
      </div>
      <div class="res-row">
        <span class="res-label">예상 월간 애드센스 수익</span>
        <span class="res-val highlight" id="outMonthlyRevenue">$680.40 (약 938,900원)</span>
      </div>
      <div class="res-row">
        <span class="res-label">도메인 매각 가치 (Flippa 30x Multiplier)</span>
        <span class="res-val flippa" id="outFlippaVal">$20,412 (약 2,816만 원)</span>
      </div>
    </div>

    <button class="btn-lead" onclick="if(window.LeadMagnet){LeadMagnet.open();}">
      🎁 2026 고단가 애드센스 키워드 100선 & CPC 3배 상승 치트시트 받기
    </button>
  </div>

  <script>
    function calculate() {
      const visitors = parseFloat(document.getElementById('inpVisitors').value) || 0;
      const pvRatio = parseFloat(document.getElementById('inpPvRatio').value) || 1.5;
      const ecpm = parseFloat(document.getElementById('inpCountry').value) || 4.0;
      const fx = parseFloat(document.getElementById('inpFxRate').value) || 1350;

      const dailyPv = visitors * pvRatio;
      const monthlyPv = dailyPv * 30;

      const dailyUsd = (dailyPv / 1000) * ecpm;
      const monthlyUsd = (monthlyPv / 1000) * ecpm;
      const flippaUsd = monthlyUsd * 30; // 보통 월수익의 28~35배 매각

      const dailyKrw = dailyUsd * fx;
      const monthlyKrw = monthlyUsd * fx;
      const flippaKrw = flippaUsd * fx;

      document.getElementById('outMonthlyPv').innerText = Math.round(monthlyPv).toLocaleString() + ' PV';
      document.getElementById('outDailyRevenue').innerText = '$' + dailyUsd.toFixed(2) + ' (약 ' + Math.round(dailyKrw).toLocaleString() + '원)';
      document.getElementById('outMonthlyRevenue').innerText = '$' + monthlyUsd.toFixed(2) + ' (약 ' + Math.round(monthlyKrw).toLocaleString() + '원)';
      document.getElementById('outFlippaVal').innerText = '$' + Math.round(flippaUsd).toLocaleString() + ' (약 ' + Math.round(flippaKrw / 10000).toLocaleString() + '만 원)';
    }
    calculate();
  </script>
</body>
</html>
