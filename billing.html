<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SETUPOD | 안전한 결제</title>
  
  <meta name="robots" content="noindex, nofollow"> <!-- 결제 페이지는 검색엔진 노출 방지 -->

  <link rel="icon" type="image/png" href="assets/favicon-32x32.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Toss Payments Widget SDK -->
  <script src="https://js.tosspayments.com/v1/payment-widget"></script>

  <style>
    body {
      font-family: 'Pretendard', 'Inter', 'Noto Sans KR', sans-serif;
      background: #0f0a1c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .billing-container {
      width: 100%;
      max-width: 500px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .btn-pay {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 24px;
    }

    .btn-pay:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(106, 17, 203, 0.4);
    }

    /* 토스 결제창 다크모드 대응 커스텀 (필요 시) */
    #payment-method { margin-top: 24px; }
  </style>
</head>
<body>

  <!-- 헤더 로고 -->
  <a href="/" style="margin-top: 40px;">
    <img src="assets/setupod_symbol.png" alt="SETUPOD" style="width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
  </a>

  <div class="billing-container">
    <h1 class="text-2xl font-bold mb-2 text-center">안전하게 결제하기</h1>
    <p class="text-gray-400 text-center text-sm mb-8">SETUPOD 글로벌 보안 결제 시스템</p>

    <!-- 결제 정보 요약 -->
    <div class="bg-black/30 p-6 rounded-xl border border-white/5 mb-6">
      <div class="flex justify-between items-center mb-4">
        <span class="text-gray-400">상품명</span>
        <span class="font-bold" id="product-name">...</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-gray-400">결제 금액</span>
        <span class="text-xl font-bold text-blue-400" id="product-price">...</span>
      </div>
    </div>

    <!-- 결제 위젯 렌더링 영역 -->
    <div id="payment-method"></div>
    <div id="agreement"></div>

    <button id="payment-request-button" class="btn-pay">결제하기</button>
  </div>

  <script src="js/toast.js"></script>
  <script>
    // URL 파라미터 파싱
    const urlParams = new URLSearchParams(window.location.search);
    const plan = urlParams.get('plan') || 'custom';
    const rawPrice = parseInt(urlParams.get('price')) || 0;
    const itemName = urlParams.get('name') || 'SETUPOD 프리미엄 서비스';
    
    // 금액 포맷팅
    const formattedPrice = rawPrice.toLocaleString('ko-KR') + '원';
    
    document.getElementById('product-name').textContent = itemName;
    document.getElementById('product-price').textContent = rawPrice > 0 ? formattedPrice : '금액 오류';

    // 토스페이먼츠 위젯 연동
    // TODO: 프로덕션에서는 라이브 클라이언트 키로 교체 필요
    const clientKey = 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq'; // 테스트용 퍼블릭 키 (임시)
    const customerKey = 'user_' + Math.random().toString(36).substring(2, 10); // 익명 유저 키 
    
    if (rawPrice > 0) {
      try {
        const paymentWidget = PaymentWidget(clientKey, customerKey);
        
        // 결제 수단 렌더링
        const paymentMethodWidget = paymentWidget.renderPaymentMethods(
          '#payment-method', 
          { value: rawPrice },
          { variantKey: 'DEFAULT' }
        );

        // 이용약관 렌더링
        paymentWidget.renderAgreement(
          '#agreement',
          { variantKey: 'AGREEMENT' }
        );

        // 결제하기 버튼 클릭
        document.getElementById('payment-request-button').addEventListener('click', async () => {
          try {
            await paymentWidget.requestPayment({
              orderId: 'ORDER_' + new Date().getTime(),
              orderName: itemName,
              successUrl: window.location.origin + '/success?plan=' + plan,
              failUrl: window.location.origin + '/fail',
              customerEmail: '',
              customerName: '',
            });
          } catch (err) {
            if (err.code === 'USER_CANCEL') {
              showToast('결제를 취소했습니다.');
            } else {
              showToast('결제 중 오류가 발생했습니다.');
              console.error(err);
            }
          }
        });
      } catch (error) {
        console.error("토스 위젯 초기화 에러:", error);
        showToast('결제 모듈을 불러오는데 실패했습니다.');
      }
    } else {
      document.getElementById('payment-request-button').disabled = true;
      document.getElementById('payment-request-button').style.opacity = '0.5';
      showToast('유효하지 않은 결제 정보입니다.');
    }
  </script>
</body>
</html>
