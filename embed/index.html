<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SETUPOD In-App Embed | 마자 디지털 자산 장학 팟</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><path d='M30 50L45 65L70 35' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/maza-telemetry.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #090d16;
      color: #f8fafc;
    }

    #embedContainer {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #podFrame {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
      background: #090d16;
    }

    /* 하단 MAZA 장학 지원 배너 & 셋업팟 업셀링 바 */
    .embed-scholarship-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: calc(100% - 24px);
      max-width: 680px;
      padding: 8px 16px;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 18px rgba(99, 102, 241, 0.15);
      font-size: 12px;
      color: #e2e8f0;
      transition: all 0.25s ease;
    }
    .embed-scholarship-bar:hover {
      border-color: rgba(99, 102, 241, 0.65);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75), 0 0 24px rgba(99, 102, 241, 0.25);
    }
    .embed-badge-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .embed-pulse-dot {
      width: 7px;
      height: 7px;
      min-width: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseGreen 2s infinite ease-in-out;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }
    .embed-badge-title {
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .embed-upsell-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      border-radius: 9999px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }
    .embed-upsell-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
      filter: brightness(1.12);
      color: #ffffff;
    }
    .embed-upsell-link .short-text { display: none; }
    @media (max-width: 680px) {
      .embed-scholarship-bar {
        bottom: 8px;
        padding: 6px 10px;
        gap: 6px;
        border-radius: 12px;
      }
      .embed-badge-title {
        font-size: 10.5px;
      }
      .embed-upsell-link {
        padding: 5px 10px;
        font-size: 10.5px;
      }
      .embed-upsell-link .full-text { display: none; }
      .embed-upsell-link .short-text { display: inline; }
    }

    /* 로더 */
    .embed-loading-overlay {
      position: absolute;
      inset: 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 40;
      transition: opacity 0.3s ease;
    }
    .embed-loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .embed-loading-text {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="embedContainer">
    <div id="loadingOverlay" class="embed-loading-overlay">
      <div class="embed-loading-spinner"></div>
      <div class="embed-loading-text" id="loadingText">비즈니스 팟 인터랙티브 엔진 로딩 중...</div>
    </div>

    <iframe id="podFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>

    <!-- 마자 장학 인증 뱃지 & 셋업팟 맞춤 팟 추가 구매 업셀링 배너 -->
    <div class="embed-scholarship-bar" id="partnerBadge">
      <div class="embed-badge-wrap">
        <span class="embed-pulse-dot"></span>
        <span class="embed-badge-title">🎓 MAZA 디지털 자산 장학 프로그램 인증 (1년 인프라 지원)</span>
      </div>
      <a href="https://setupod.com?utm_source=maza_scholarship_embed&utm_medium=embed_bottom_bar&utm_campaign=upsell" target="_blank" rel="noopener noreferrer" class="embed-upsell-link">
        <span class="full-text">🚀 셋업팟 공식 스토어에서 나만의 맞춤 팟 추가하기 →</span>
        <span class="short-text">🚀 맞춤 팟 추가하기 →</span>
      </a>
    </div>
  </div>

  <script>
    (function() {
      // 1. 파라미터 파싱
      const urlParams = new URLSearchParams(window.location.search);
      
      // 경로 파싱 (/embed/planner 형태 지원)
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      let podIdFromPath = '';
      if (pathSegments.length >= 2 && pathSegments[0] === 'embed') {
        podIdFromPath = pathSegments[1];
      }

      const podId = urlParams.get('podId') || urlParams.get('pod_id') || podIdFromPath || 'planner';
      const domain = urlParams.get('domain') || window.location.hostname;
      const theme = urlParams.get('theme') || 'dark';
      const utmSource = urlParams.get('utm_source') || 'maza';

      // 2. 팟 매핑
      const POD_ROUTES = {
        'planner': '/planner/index.html',
        'bizcard': '/bizcard/card.html?id=demo',
        'bizcard3d': '/bizcard/card.html?id=demo',
        'calculator': '/margin/index.html',
        'margin': '/margin/index.html',
        'runway': '/runway/index.html',
        'nomad': '/nomad/index.html',
        'adsense': '/adsense/index.html',
        'adsense_calc': '/adsense/index.html',
        'fx': '/fx/index.html',
        'fx_calc': '/fx/index.html',
        'multilink': '/multilink/index.html',
        'secret_room': '/secret_room/index.html',
        'memopod': '/memopod/index.html',
        'insta': '/insta/index.html',
        'kakao': '/kakao/index.html'
      };

      const targetUrl = POD_ROUTES[podId] || POD_ROUTES['planner'];

      // 3. 텔레메트리 연동 (MAZA 백엔드로 트래픽 & 체류시간 전송)
      if (window.MazaTelemetry) {
        window.MazaTelemetry.init({
          domain: domain,
          podId: podId,
          assetType: 'pod',
          endpoint: 'https://mazastudio.kr/api/telemetry/event'
        });
      }

      // 4. iframe 로드
      const frame = document.getElementById('podFrame');
      const loader = document.getElementById('loadingOverlay');

      frame.onload = function() {
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 300);
        }
      };

      // 파라미터 전달 (theme, embed=1 등)
      const separator = targetUrl.includes('?') ? '&' : '?';
      frame.src = targetUrl + separator + 'embed=1&theme=' + encodeURIComponent(theme) + '&domain=' + encodeURIComponent(domain);

      if (window.lucide) {
        lucide.createIcons();
      }
    })();
  </script>
</body>
</html>
