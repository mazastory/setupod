<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>쿠팡 로켓그로스 vs 스마트스토어 역마진 진단기 | SETUPOD</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310b981'/><path d='M30 50L45 65L70 35' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/maza-telemetry.js"></script>
  <script src="/js/lead-magnet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Pretendard', sans-serif; background: #060e14; color: #f8fafc; min-height: 100vh; padding: 32px 16px; display: flex; flex-direction: column; align-items: center; }
    .pod-container { width: 100%; max-width: 900px; }
    .pod-header { text-align: center; margin-bottom: 28px; }
    .pod-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); border-radius: 9999px; font-size: 12px; font-weight: 800; color: #34d399; margin-bottom: 12px; }
    .pod-title { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #fff; margin-bottom: 8px; }
    .pod-desc { font-size: 14px; color: #94a3b8; }
    
    .calc-card { background: #0f1c24; border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 36px 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 24px; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    @media (max-width: 768px) { .grid-2col { grid-template-columns: 1fr; } .calc-card { padding: 24px 20px; } }

    .input-group { margin-bottom: 18px; }
    .input-label { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; display: block; }
    .input-field { width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; outline: none; }
    .input-field:focus { border-color: #10b981; }

    /* Comparison Box */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
    .compare-card { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 20px 16px; text-align: center; }
    .compare-card.highlight { border-color: #10b981; background: rgba(16,185,129,0.08); }
    .compare-name { font-size: 13px; font-weight: 800; color: #94a3b8; margin-bottom: 6px; }
    .compare-margin { font-size: 32px; font-weight: 900; color: #fff; letter-spacing: -0.02em; margin-bottom: 4px; }
    .compare-profit { font-size: 13px; font-weight: 700; color: #34d399; }

    .alert-box { background: rgba(239,68,68,0.1); border-left: 4px solid #ef4444; border-radius: 12px; padding: 14px 16px; font-size: 12.5px; color: #fca5a5; margin-top: 18px; line-height: 1.5; }
    .btn-magnet { width: 100%; padding: 15px; background: #10b981; border: none; border-radius: 14px; font-size: 14px; font-weight: 900; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; transition: all 0.2s; }
    .btn-magnet:hover { background: #34d399; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div class="pod-container">
    <div class="pod-header">
      <div class="pod-badge">
        <i data-lucide="calculator" style="width: 14px; height: 14px; color: #10b981;"></i>
        <span>이커머스 마진율 검증기</span>
      </div>
      <h1 class="pod-title">쿠팡 로켓그로스 vs 스마트스토어 역마진 진단기</h1>
      <p class="pod-desc">숨겨진 입출고 배송비와 보관료까지 차감한 진짜 내 손의 순마진을 1초 만에 비교하세요.</p>
    </div>

    <div class="calc-card">
      <div class="grid-2col">
        <!-- Inputs -->
        <div>
          <div class="input-group">
            <label class="input-label">소비자 판매가 (원)</label>
            <input type="number" id="inpSalePrice" class="input-field" value="28900" step="100">
          </div>
          <div class="input-group">
            <label class="input-label">원가 / 사입가 (원)</label>
            <input type="number" id="inpCostPrice" class="input-field" value="9500" step="100">
          </div>
          <div class="input-group">
            <label class="input-label">기본 택배 배송비 (원)</label>
            <input type="number" id="inpDelivery" class="input-field" value="3000" step="100">
          </div>
          <div class="input-group">
            <label class="input-label">상품 카테고리 수수료율 (%)</label>
            <input type="number" id="inpCategoryFee" class="input-field" value="10.8" step="0.1">
          </div>
        </div>

        <!-- Outputs -->
        <div>
          <div style="font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 10px;">플랫폼별 최종 순이익 비교</div>
          
          <div class="compare-grid">
            <div class="compare-card">
              <div class="compare-name">네이버 스마트스토어</div>
              <div class="compare-margin" id="naverMargin">42.1%</div>
              <div class="compare-profit" id="naverProfit">+12,160원</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 4px;">수수료 약 5.5% 적용</div>
            </div>

            <div class="compare-card highlight">
              <div class="compare-name">쿠팡 로켓그로스</div>
              <div class="compare-margin" id="coupangMargin" style="color:#f87171;">18.4%</div>
              <div class="compare-profit" id="coupangProfit" style="color:#f87171;">+5,310원</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 4px;">입출고비/풀필먼트 차감</div>
            </div>
          </div>

          <div class="alert-box" id="warningBox">
            💡 <strong>주의:</strong> 로켓그로스는 판매 1건당 평균 2,400원~3,300원의 풀필먼트 수수료가 추가 차감됩니다. 광고비(ROAS) 집행 시 즉시 역마진 위험이 있습니다.
          </div>

          <button class="btn-magnet" onclick="if(window.LeadMagnet) window.LeadMagnet.open();">
            <i data-lucide="file-spreadsheet" style="width: 16px; height: 16px;"></i>
            <span>역마진 방지 엑셀/노션 템플릿 다운로드</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calculateMargin() {
      var sale = parseFloat(document.getElementById('inpSalePrice').value) || 0;
      var cost = parseFloat(document.getElementById('inpCostPrice').value) || 0;
      var delivery = parseFloat(document.getElementById('inpDelivery').value) || 0;
      var catFeeRate = (parseFloat(document.getElementById('inpCategoryFee').value) || 0) / 100;

      // 1. 스마트스토어 (수수료 약 5.63% + 배송비)
      var naverFee = sale * 0.0563;
      var naverProfit = sale - cost - delivery - naverFee;
      var naverRate = sale > 0 ? ((naverProfit / sale) * 100).toFixed(1) : 0;

      // 2. 쿠팡 로켓그로스 (카테고리 수수료 + 입출고/보관료 약 2,600원 + 부가세)
      var coupangFee = sale * catFeeRate;
      var fulfillmentFee = 2650; // 표준 소형 로켓그로스 피
      var coupangProfit = sale - cost - coupangFee - fulfillmentFee;
      var coupangRate = sale > 0 ? ((coupangProfit / sale) * 100).toFixed(1) : 0;

      document.getElementById('naverMargin').innerText = naverRate + '%';
      document.getElementById('naverProfit').innerText = (naverProfit >= 0 ? '+' : '') + Math.round(naverProfit).toLocaleString() + '원';

      var cpMarginEl = document.getElementById('coupangMargin');
      var cpProfitEl = document.getElementById('coupangProfit');
      cpMarginEl.innerText = coupangRate + '%';
      cpProfitEl.innerText = (coupangProfit >= 0 ? '+' : '') + Math.round(coupangProfit).toLocaleString() + '원';

      if (coupangProfit < 0) {
        cpMarginEl.style.color = '#ef4444';
        cpProfitEl.style.color = '#ef4444';
        document.getElementById('warningBox').innerHTML = '🚨 <strong>역마진 발생!</strong> 판매할수록 손실이 발생합니다. 판매가를 높이거나 매입 원가를 재조정하세요.';
      } else {
        cpMarginEl.style.color = '#f59e0b';
        cpProfitEl.style.color = '#f59e0b';
        document.getElementById('warningBox').innerHTML = '💡 <strong>주의:</strong> 로켓그로스는 풀필먼트 수수료가 추가 차감됩니다. 광고비(ROAS) 집행 시 신중한 마진 관리가 필요합니다.';
      }
    }

    document.querySelectorAll('.input-field').forEach(function(inp) {
      inp.addEventListener('input', calculateMargin);
    });

    calculateMargin();
    if (window.lucide) lucide.createIcons();

    if (window.MazaTelemetry) {
      window.MazaTelemetry.init({ podId: 'margin' });
    }
  </script>
</body>
</html>
