<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-67QE5VV6XR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-67QE5VV6XR');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 후기 증명 월 스튜디오 | SETUPOD</title>
  <meta name="description" content="카카오톡 칭찬 캡처와 VIP 추천사로 신뢰를 종결짓는 인터랙티브 후기 월 생성기">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0"></script>

  <style>
    :root {
      --bg: #070510;
      --panel: #100b21;
      --border: rgba(255, 255, 255, 0.1);
      --violet: #8b5cf6;
      --cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 480px;
      min-width: 400px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .sidebar-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header-left h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(135deg, #fae100, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-header-left p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2px;
    }

    .back-link {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 800;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: #c4b5fd;
    }

    .section-title:first-child { margin-top: 0; }

    .form-group { margin-bottom: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 6px;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
    }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }

    .form-textarea {
      height: 60px;
      resize: vertical;
      line-height: 1.4;
    }

    .sidebar-footer {
      padding: 18px 24px;
      background: rgba(0, 0, 0, 0.35);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #fae100, #eab308);
      color: #261601;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(250, 225, 0, 0.35);
      transition: all 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-group-sub { display: flex; gap: 8px; }

    .btn-sub {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* Preview Area */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1a1433 0%, #070510 100%);
      padding: 30px;
      position: relative;
    }

    .view-toggle-bar {
      position: absolute;
      top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    .view-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .view-btn.active {
      background: var(--violet);
      color: #fff;
    }

    .device-mockup {
      width: 395px;
      height: 790px;
      background: #000;
      border-radius: 46px;
      border: 10px solid #231c38;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .device-mockup.desktop-mode {
      width: 90%;
      max-width: 960px;
      height: 85%;
      border-radius: 16px;
      border-width: 8px;
    }

    .device-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 22px;
      background: #231c38;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 10;
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #06040d;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-left">
        <h1><i data-lucide="shield-check" style="width:20px;height:20px;color:#fae100;"></i> 후기 증명 스튜디오</h1>
        <p>카톡 리얼 피드백으로 고객 신뢰를 종결짓습니다.</p>
      </div>
      <a href="index.html" class="back-link">
        <i data-lucide="home" style="width:13px;height:13px;"></i> 홈
      </a>
    </div>

    <div class="scroll-area">
      <!-- Section 1 -->
      <div class="section-title"><i data-lucide="user" style="width:14px;height:14px;"></i> 1. 기본 프로필 정보</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">브랜드 / 전문가 이름</label>
          <input type="text" id="cfgBrand" class="form-input" value="넥서스 크리에이티브" oninput="saveAndPreview()">
        </div>
        <div class="form-group">
          <label class="form-label">누적 후기 건수</label>
          <input type="text" id="cfgCount" class="form-input" value="148" oninput="saveAndPreview()">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">신뢰 슬로건 (한 줄 소개)</label>
        <input type="text" id="cfgSlogan" class="form-input" value="전환율 중심 3D 디지털 명함 & 세일즈 퍼널 전문 스튜디오" oninput="saveAndPreview()">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">카톡 상담 링크</label>
          <input type="text" id="cfgKakao" class="form-input" value="https://open.kakao.com" oninput="saveAndPreview()">
        </div>
        <div class="form-group">
          <label class="form-label">내 3D 명함 URL</label>
          <input type="text" id="cfgCard" class="form-input" value="card.html" oninput="saveAndPreview()">
        </div>
      </div>

      <!-- Section 2: 카톡 후기 -->
      <div class="section-title"><i data-lucide="message-circle" style="width:14px;height:14px;color:#fae100;"></i> 2. 카카오톡 리얼 피드백 3종</div>
      
      <!-- Chat 1 -->
      <div style="background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05);">
        <div class="form-row">
          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label">고객 1 성함 / 직책</label>
            <input type="text" id="c1Name" class="form-input" value="(주)블루웨일 이진우 대표" oninput="saveAndPreview()">
          </div>
          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label">시간</label>
            <input type="text" id="c1Time" class="form-input" value="오후 4:21" oninput="saveAndPreview()">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">카톡 칭찬 본문</label>
          <textarea id="c1Text" class="form-textarea" oninput="saveAndPreview()">대표님!! 어제 오픈한 링크로 벌써 문의가 12건이나 들어왔어요 ㅠㅠ 제안서랑 명함 퀄리티 보고 클라이언트가 바로 계약금 입금했습니다. 진짜 대박이네요!</textarea>
        </div>
      </div>

      <!-- Chat 2 -->
      <div style="background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05);">
        <div class="form-row">
          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label">고객 2 성함 / 직책</label>
            <input type="text" id="c2Name" class="form-input" value="피크엔터테인먼트 박상훈 이사" oninput="saveAndPreview()">
          </div>
          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label">시간</label>
            <input type="text" id="c2Time" class="form-input" value="오전 11:45" oninput="saveAndPreview()">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">카톡 칭찬 본문</label>
          <textarea id="c2Text" class="form-textarea" oninput="saveAndPreview()">미팅 자리에서 폰으로 3D 명함 띄워드리니까 상대 임원분들 눈이 휘둥그레지시네요 ㅋㅋㅋ 다들 어디서 만들었냐고 링크 물어봐서 대표님 명함 링크 바로 보내드렸습니다!</textarea>
        </div>
      </div>

      <!-- Chat 3 -->
      <div style="background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05);">
        <div class="form-row">
          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label">고객 3 성함 / 직책</label>
            <input type="text" id="c3Name" class="form-input" value="그로스랩 마케팅총괄 김민서" oninput="saveAndPreview()">
          </div>
          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label">시간</label>
            <input type="text" id="c3Time" class="form-input" value="어제 오후 6:10" oninput="saveAndPreview()">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">카톡 칭찬 본문</label>
          <textarea id="c3Text" class="form-textarea" oninput="saveAndPreview()">기존에는 무거운 PDF 제안서 보내면 열람률이 10%도 안 됐는데, 1페이지 스마트 제안서로 바꾸고 나서 견적 승인율이 3배 이상 뛰었습니다. 이번 하반기 프로젝트도 무조건 대표팀이랑만 진행하겠습니다.</textarea>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="sidebar-footer">
      <button class="btn-primary" onclick="copyShareUrl()">
        <i data-lucide="link" style="width:16px;height:16px;"></i> 후기 증명 월 링크 생성 & 복사
      </button>
      <div class="btn-group-sub">
        <button class="btn-sub" onclick="openLive()">
          <i data-lucide="external-link" style="width:14px;height:14px;"></i> 새 탭 열기
        </button>
        <button class="btn-sub" onclick="copyEmbedCode()">
          <i data-lucide="code" style="width:14px;height:14px;color:#06b6d4;"></i> 위젯 임베드 코드
        </button>
      </div>
    </div>
  </aside>

  <!-- Right Preview -->
  <main class="preview-area">
    <div class="view-toggle-bar">
      <button class="view-btn active" id="btnMobile" onclick="setMode('mobile')">
        <i data-lucide="smartphone" style="width:14px;height:14px;"></i> 모바일 뷰
      </button>
      <button class="view-btn" id="btnDesktop" onclick="setMode('desktop')">
        <i data-lucide="monitor" style="width:14px;height:14px;"></i> 데스크톱 뷰
      </button>
    </div>

    <div class="device-mockup" id="mockupFrame">
      <div class="device-notch"></div>
      <iframe id="previewIframe" class="preview-iframe" src="proof.html?preview=true"></iframe>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function getFormData() {
      return {
        brandName: document.getElementById('cfgBrand').value,
        reviewCount: document.getElementById('cfgCount').value,
        slogan: document.getElementById('cfgSlogan').value,
        kakaoUrl: document.getElementById('cfgKakao').value,
        cardUrl: document.getElementById('cfgCard').value,
        chatList: [
          { name: document.getElementById('c1Name').value, time: document.getElementById('c1Time').value, text: document.getElementById('c1Text').value, likes: 4 },
          { name: document.getElementById('c2Name').value, time: document.getElementById('c2Time').value, text: document.getElementById('c2Text').value, likes: 5 },
          { name: document.getElementById('c3Name').value, time: document.getElementById('c3Time').value, text: document.getElementById('c3Text').value, likes: 6 }
        ]
      };
    }

    function saveAndPreview() {
      const data = getFormData();
      localStorage.setItem('setupod_proof_cfg', JSON.stringify(data));

      const iframe = document.getElementById('previewIframe');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage('reload_proof', '*');
      }
    }

    function setMode(mode) {
      const mockup = document.getElementById('mockupFrame');
      const btnM = document.getElementById('btnMobile');
      const btnD = document.getElementById('btnDesktop');

      if (mode === 'desktop') {
        mockup.classList.add('desktop-mode');
        btnD.classList.add('active');
        btnM.classList.remove('active');
      } else {
        mockup.classList.remove('desktop-mode');
        btnM.classList.add('active');
        btnD.classList.remove('active');
      }
    }

    function getShareUrl() {
      const data = getFormData();
      const jsonStr = JSON.stringify(data);
      const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
      return `${window.location.origin}/proof.html?data=${encoded}`;
    }

    function copyShareUrl() {
      saveAndPreview();
      const url = getShareUrl();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          alert("🎉 후기 증명 월 링크가 복사되었습니다!\n\n" + url);
        });
      } else {
        prompt("후기 링크 복사:", url);
      }
    }

    function openLive() {
      saveAndPreview();
      const url = getShareUrl();
      window.open(url, '_blank');
    }

    function copyEmbedCode() {
      saveAndPreview();
      const url = getShareUrl();
      const iframeCode = `<iframe src="${url}" width="100%" height="700px" frameborder="0" style="border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></iframe>`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(iframeCode).then(() => {
          alert("💻 위젯 임베드 코드가 복사되었습니다!\n\n노션, 홈페이지, 블로그에 그대로 붙여넣으세요.");
        });
      } else {
        prompt("임베드 코드 복사:", iframeCode);
      }
    }

    saveAndPreview();
  </script>
</body>
</html>
