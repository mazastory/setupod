<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-67QE5VV6XR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-67QE5VV6XR');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>기회비용(ROI) 계산기 | SETUPOD</title>
  <meta name="description" content="SETUPOD - 카카오톡, 인스타그램, 3D 명함까지 한 번에 셋업하는 올인원 비즈니스 자산 플랫폼">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.344.0"></script>

  <style>
    :root {
      --bg: #070510;
      --card-bg: #110c22;
      --border: rgba(255, 255, 255, 0.1);
      --violet: #8b5cf6;
      --cyan: #06b6d4;
      --rose: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #d8b4fe;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      text-transform: uppercase;
      text-align: center;
      align-self: center;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 12px;
      text-align: center;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.desc {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      margin-bottom: 32px;
      text-align: center;
      word-break: keep-all;
    }

    .calculator-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .input-group { margin-bottom: 24px; }
    .input-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.8); margin-bottom: 12px; }
    .input-value { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--cyan); }
    
    input[type=range] {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      margin-top: -10px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
    }
    input[type=range]:focus { outline: none; }

    .result-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-top: 32px;
    }

    .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .result-row:last-child { margin-bottom: 0; }
    .result-title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6); }
    .result-number { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900; }
    
    .loss { color: var(--rose); text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
    .gain { color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); font-size: 32px; }

    .btn-main {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--violet), #6d28d9);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5); }

    .branding {
      margin-top: 40px;
      text-align: center;
    }
    .branding a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">ROI CALCULATOR</div>
    <h1>디지털 자산 기회비용 계산기</h1>
    <p class="desc">종이 명함이나 빈약한 프로필 링크로 인해 매달 버려지고 있는 잠재 매출액을 계산해 드립니다.</p>

    <div class="calculator-card">
      <div class="input-group">
        <div class="input-label">
          <span>월 평균 프로필 방문/조회 수</span>
          <span class="input-value" id="valTraffic">1,000 명</span>
        </div>
        <input type="range" id="sliderTraffic" min="100" max="10000" step="100" value="1000" oninput="calculate()">
      </div>

      <div class="input-group">
        <div class="input-label">
          <span>고객 1명당 예상 평균 객단가 (LTV)</span>
          <span class="input-value" id="valPrice">₩100,000</span>
        </div>
        <input type="range" id="sliderPrice" min="10000" max="2000000" step="10000" value="100000" oninput="calculate()">
      </div>

      <div class="result-box">
        <div class="result-row" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 16px;">
          <div>
            <div class="result-title">현재 1% 전환 시 월 매출</div>
          </div>
          <div class="result-number" id="resCurrent">₩1,000,000</div>
        </div>
        
        <div class="result-row" style="margin-top: 16px;">
          <div>
            <div class="result-title" style="color:var(--cyan);">SETUPOD 도입 후 (15% 전환율 적용)</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:4px;">압도적인 3D 인터랙션과 원클릭 주소록 저장 효과</div>
          </div>
        </div>
        <div class="result-row">
          <div class="result-title">예상 추가 월 매출</div>
          <div class="result-number gain" id="resGain">+ ₩14,000,000</div>
        </div>
      </div>
    </div>

    <a href="maker.html" class="btn-main">
      <i data-lucide="sparkles" style="width:18px;"></i> 지금 당장 손실 막기 (무료 제작)
    </a>

    <div class="branding">
      <a href="https://setupod.com" target="_blank">Powered by <strong style="color:#fff; font-family:'Montserrat',sans-serif;">SETUPOD</strong></a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function formatKRW(num) {
      return "₩" + num.toLocaleString();
    }

    function calculate() {
      const traffic = parseInt(document.getElementById('sliderTraffic').value);
      const price = parseInt(document.getElementById('sliderPrice').value);

      document.getElementById('valTraffic').innerText = traffic.toLocaleString() + " 명";
      document.getElementById('valPrice').innerText = formatKRW(price);

      // Current assumption: 1% conversion rate for standard linktree/paper card
      const currentRevenue = traffic * 0.01 * price;
      
      // SETUPOD assumption: 15% conversion rate due to 3D interactivity & one-click vCard save
      const setupodRevenue = traffic * 0.15 * price;
      const extraGain = setupodRevenue - currentRevenue;

      document.getElementById('resCurrent').innerText = formatKRW(currentRevenue);
      document.getElementById('resGain').innerText = "+ " + formatKRW(extraGain);
    }

    // Init
    calculate();

    // CTA click tracking
    document.querySelector('.btn-main')?.addEventListener('click', function() {
      if (typeof gtag === 'function') {
        gtag('event', 'click_cta_maker', {
          event_category: 'conversion_funnel',
          source: 'roi_calculator'
        });
      }
    });
  </script>
</body>
</html>
