<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>진단 테스트 | SETUPOD</title>
  <meta name="description" content="SETUPOD - 카카오톡, 인스타그램, 3D 명함까지 한 번에 셋업하는 올인원 비즈니스 자산 플랫폼">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.344.0"></script>

  <style>
    :root {
      --bg: #070510;
      --card-bg: #110c22;
      --border: rgba(255, 255, 255, 0.1);
      --violet: #8b5cf6;
      --cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .header-bar {
      margin-bottom: 40px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #d8b4fe;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.desc {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      word-break: keep-all;
    }

    /* Screen Manager */
    .screen { display: none; width: 100%; animation: fadeIn 0.4s ease forwards; }
    .screen.active { display: flex; flex-direction: column; flex: 1; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Question Screen */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      margin-bottom: 32px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--violet);
      width: 0%;
      transition: width 0.3s ease;
    }

    .q-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: var(--cyan);
      margin-bottom: 8px;
    }

    .q-text {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 32px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .option-btn {
      width: 100%;
      padding: 18px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover, .option-btn:active {
      background: rgba(139, 92, 246, 0.1);
      border-color: var(--violet);
      transform: translateY(-2px);
    }

    /* Result Screen */
    .result-score-box {
      text-align: center;
      margin-bottom: 32px;
      padding: 40px 20px;
      background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    }
    .score-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 40px rgba(139, 92, 246, 0.6);
      line-height: 1;
    }

    .result-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--cyan);
      text-align: center;
      margin-bottom: 16px;
    }

    .result-message {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.85);
      margin-bottom: 32px;
    }

    /* Buttons */
    .btn-main {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--violet), #6d28d9);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-main:active { transform: scale(0.98); }

    .btn-secondary {
      width: 100%;
      padding: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      margin-top: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    /* Footer Branding */
    .branding {
      margin-top: auto;
      padding-top: 40px;
      text-align: center;
    }
    .branding a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
    .branding a:hover { color: rgba(255,255,255,0.7); }

  </style>
</head>
<body>

  <div class="container">
    
    <!-- Screen 1: Intro -->
    <div id="screenIntro" class="screen active">
      <div class="header-bar">
        <div class="badge">DIAGNOSTIC TEST</div>
        <h1 id="uiTitle">진단 테스트</h1>
        <p class="desc" id="uiDesc">설명을 불러오는 중입니다...</p>
      </div>
      <button class="btn-main" onclick="startTest()">테스트 시작하기 <i data-lucide="arrow-right" style="width:18px;"></i></button>
      
      <div class="branding">
        <a href="https://setupod.com" target="_blank">Powered by <strong style="color:#fff; font-family:'Montserrat',sans-serif;">SETUPOD</strong></a>
      </div>
    </div>

    <!-- Screen 2: Question -->
    <div id="screenQuestion" class="screen">
      <div class="progress-bar">
        <div class="progress-fill" id="uiProgress"></div>
      </div>
      <div class="q-number" id="uiQNum">Q1</div>
      <div class="q-text" id="uiQText">질문 내용</div>
      <div id="uiOptions"></div>
    </div>

    <!-- Screen 3: Result -->
    <div id="screenResult" class="screen">
      <div class="badge" style="margin: 0 auto 16px; display: table;">YOUR RESULT</div>
      <div class="result-score-box">
        <div class="score-number" id="uiScore">0</div>
        <div style="font-family:'Montserrat',sans-serif; color:rgba(255,255,255,0.5); font-weight:700; margin-top:8px;">TOTAL SCORE</div>
      </div>
      
      <div class="result-title" id="uiResultTitle">결과 타이틀</div>
      <div class="result-message" id="uiResultMsg">결과 상세 메시지</div>

      <a href="#" id="uiCtaBtn" class="btn-main" target="_blank">솔루션 확인하기 <i data-lucide="external-link" style="width:16px;"></i></a>
      <a href="scorecard_maker.html" class="btn-secondary" target="_blank">나도 이런 테스트 만들기 (무료)</a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    let config = null;
    let currentQ = 0;
    let totalScore = 0;

    // Load Data
    function loadConfig() {
      const raw = localStorage.getItem('setupod_scorecard_cfg');
      if(raw) {
        config = JSON.parse(raw);
        document.getElementById('uiTitle').innerText = config.title;
        document.getElementById('uiDesc').innerText = config.description;
        document.getElementById('uiCtaBtn').href = config.ctaUrl || 'https://setupod.com';
      } else {
        document.getElementById('uiTitle').innerText = "오류";
        document.getElementById('uiDesc').innerText = "데이터를 찾을 수 없습니다.";
      }
    }

    // iframe preview auto-reload
    window.addEventListener('message', (e) => {
      if(e.data === 'reload_scorecard') {
        loadConfig();
        showScreen('screenIntro');
      }
    });

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startTest() {
      if(!config || !config.questions || config.questions.length === 0) return alert("질문이 없습니다.");
      currentQ = 0;
      totalScore = 0;
      renderQuestion();
      showScreen('screenQuestion');
    }

    function renderQuestion() {
      const q = config.questions[currentQ];
      const total = config.questions.length;
      
      document.getElementById('uiProgress').style.width = `${((currentQ)/total)*100}%`;
      document.getElementById('uiQNum').innerText = `Q${currentQ + 1} / ${total}`;
      document.getElementById('uiQText').innerText = q.q;

      const optsDiv = document.getElementById('uiOptions');
      optsDiv.innerHTML = '';
      
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.score);
        optsDiv.appendChild(btn);
      });
    }

    function selectOption(score) {
      totalScore += score;
      currentQ++;
      
      if(currentQ < config.questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('uiScore').innerText = totalScore;
      
      // Find outcome
      let outcome = config.outcomes.find(o => totalScore >= o.min && totalScore <= o.max);
      if(!outcome && config.outcomes.length > 0) outcome = config.outcomes[config.outcomes.length-1]; // fallback
      
      if(outcome) {
        document.getElementById('uiResultTitle').innerText = outcome.title;
        document.getElementById('uiResultMsg').innerText = outcome.message;
      }
      
      showScreen('screenResult');
    }

    // Init
    loadConfig();
  </script>
</body>
</html>
