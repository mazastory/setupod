<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Sticker Slicer Studio | SETUPOD</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --primary: #f472b6; /* Pink accent for stickers */
      --primary-hover: #ec4899;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', -apple-system, sans-serif;
      line-height: 1.5;
    }
    .header {
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .brand-badge { background: var(--primary); color: #000; font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
    
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .hero-title { font-size: 32px; font-weight: 800; margin-bottom: 12px; text-align: center; }
    .hero-desc { color: #a1a1aa; text-align: center; margin-bottom: 40px; }
    
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      background: var(--card);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 30px;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--primary);
      background: rgba(244, 114, 182, 0.05);
    }
    .upload-area i { color: var(--primary); margin-bottom: 16px; width: 48px; height: 48px; }
    .upload-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .upload-desc { color: #71717a; font-size: 14px; }
    
    #fileInput { display: none; }
    
    .workspace {
      display: none;
      grid-template-columns: 1fr 300px;
      gap: 24px;
    }
    
    .canvas-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: auto;
      padding: 20px;
      position: relative;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Transparent checkboard pattern */
    .canvas-bg {
      background-image: 
        linear-gradient(45deg, #1f1f22 25%, transparent 25%), 
        linear-gradient(-45deg, #1f1f22 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1f1f22 75%), 
        linear-gradient(-45deg, transparent 75%, #1f1f22 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    canvas { max-width: 100%; object-fit: contain; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    
    .sidebar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      height: fit-content;
    }
    
    .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .stat-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }
    .stat-num { font-size: 32px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: #a1a1aa; }

    .control-group { margin-bottom: 20px; }
    .control-label { font-size: 13px; color: #a1a1aa; margin-bottom: 8px; display: block; }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: #000;
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      margin-bottom: 12px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    
    #loading {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border-radius: 16px;
      z-index: 10;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(244, 114, 182, 0.3);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      SETUPOD <span class="brand-badge">Sticker Slicer</span>
    </div>
    <a href="index.html" style="color: #a1a1aa; text-decoration: none; font-size: 14px; font-weight: 500;">메인으로 돌아가기</a>
  </header>

  <div class="container">
    <h1 class="hero-title">통이미지를 낱개 스티커로, 1초 만에.</h1>
    <p class="hero-desc">배경이 하얀 다꾸 스티커 시트를 올리면, AI가 자동으로 테두리를 인식해 투명 배경 PNG로 분할해 줍니다.</p>

    <!-- Upload Area -->
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <i data-lucide="scissors"></i>
      <h3 class="upload-title">이미지를 드래그하거나 클릭하여 업로드</h3>
      <p class="upload-desc">지원 포맷: JPG, PNG, WEBP (흰색 배경 또는 투명 배경)</p>
      <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">
    </div>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
      <div class="canvas-container canvas-bg" id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
        <div id="loading">
          <div class="spinner"></div>
          <div style="color: #fff; font-weight: 700;">스티커 테두리 분석 중...</div>
        </div>
      </div>
      
      <div class="sidebar">
        <div class="panel-title"><i data-lucide="layers"></i> 분석 결과</div>
        
        <div class="stat-box">
          <div class="stat-num" id="stickerCount">0</div>
          <div class="stat-label">인식된 스티커 (개)</div>
        </div>
        
        <div class="control-group">
          <label class="control-label">배경 제거 (흰색 날리기)</label>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary" style="margin:0; flex:1;" id="btnToggleBg">배경 보기</button>
          </div>
        </div>
        
        <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
          <i data-lucide="image-plus"></i> 다른 이미지 올리기
        </button>
        <button class="btn btn-primary" id="btnDownloadZip">
          <i data-lucide="download"></i> ZIP 파일로 일괄 다운로드
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
    const stickerCountEl = document.getElementById('stickerCount');
    const loadingEl = document.getElementById('loading');
    
    let originalImage = null;
    let stickersData = []; // [{x, y, w, h, canvas}]
    let showBoxes = true;
    let isBgRemoved = true;

    // Drag & Drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });
    function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
    ['dragenter', 'dragover'].forEach(eventName => dropZone.classList.add('dragover'));
    ['dragleave', 'drop'].forEach(eventName => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
    fileInput.addEventListener('change', e => handleFiles(e.target.files));

    function handleFiles(files) {
      if (!files.length) return;
      const file = files[0];
      if (!file.type.match('image.*')) return alert('이미지 파일만 업로드 가능합니다.');
      
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          dropZone.style.display = 'none';
          workspace.style.display = 'grid';
          processImage();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function processImage() {
      loadingEl.style.display = 'flex';
      
      setTimeout(() => {
        // Set canvas size
        mainCanvas.width = originalImage.width;
        mainCanvas.height = originalImage.height;
        ctx.drawImage(originalImage, 0, 0);
        
        const imgData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
        const data = imgData.data;
        
        // 1. Remove White Background (Make Transparent)
        if (isBgRemoved) {
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            // If near white, make transparent
            if (r > 240 && g > 240 && b > 240) {
              data[i+3] = 0; // Alpha to 0
            }
          }
          ctx.putImageData(imgData, 0, 0);
        }

        // 2. Find Connected Components (Bounding Boxes)
        stickersData = findBoundingBoxes(imgData);
        stickerCountEl.innerText = stickersData.length;

        // 3. Draw Bounding Boxes
        drawPreview();
        
        loadingEl.style.display = 'none';
      }, 50); // small delay to let UI show loading
    }

    function findBoundingBoxes(imgData) {
      const w = imgData.width;
      const h = imgData.height;
      const data = imgData.data;
      const visited = new Uint8Array(w * h);
      const boxes = [];
      const minSize = 20; // Ignore dust smaller than 20x20 pixels
      const padding = 10; // Padding around cut sticker

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          if (visited[idx]) continue;
          
          // Check alpha
          if (data[(idx * 4) + 3] > 10) { 
            // Found a non-transparent pixel, run BFS to find bounds
            let minX = x, maxX = x, minY = y, maxY = y;
            const queue = [idx];
            visited[idx] = 1;

            let head = 0;
            while(head < queue.length) {
              const curr = queue[head++];
              const cx = curr % w;
              const cy = Math.floor(curr / w);

              if (cx < minX) minX = cx;
              if (cx > maxX) maxX = cx;
              if (cy < minY) minY = cy;
              if (cy > maxY) maxY = cy;

              // Check 8 neighbors
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx === 0 && dy === 0) continue;
                  const nx = cx + dx, ny = cy + dy;
                  if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    const nIdx = ny * w + nx;
                    if (!visited[nIdx] && data[(nIdx * 4) + 3] > 10) {
                      visited[nIdx] = 1;
                      queue.push(nIdx);
                    }
                  }
                }
              }
            } // end BFS

            const boxW = maxX - minX;
            const boxH = maxY - minY;
            
            // Only add if it's large enough (not noise)
            if (boxW >= minSize && boxH >= minSize) {
              // Add padding
              const pMinX = Math.max(0, minX - padding);
              const pMinY = Math.max(0, minY - padding);
              const pMaxX = Math.min(w, maxX + padding);
              const pMaxY = Math.min(h, maxY + padding);
              
              boxes.push({ x: pMinX, y: pMinY, w: pMaxX - pMinX, h: pMaxY - pMinY });
            }
          }
        }
      }
      return boxes;
    }

    function drawPreview() {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      ctx.drawImage(originalImage, 0, 0);
      
      // Apply alpha mask if removed
      if (isBgRemoved) {
        const imgData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
        for (let i = 0; i < imgData.data.length; i += 4) {
          if (imgData.data[i] > 240 && imgData.data[i+1] > 240 && imgData.data[i+2] > 240) {
            imgData.data[i+3] = 0;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      }

      if (showBoxes) {
        ctx.strokeStyle = '#f472b6'; // Pink border
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        stickersData.forEach(box => {
          ctx.strokeRect(box.x, box.y, box.w, box.h);
        });
      }
    }

    document.getElementById('btnToggleBg').addEventListener('click', function() {
      isBgRemoved = !isBgRemoved;
      this.innerText = isBgRemoved ? "배경 보기" : "배경 날리기";
      drawPreview();
    });

    document.getElementById('btnDownloadZip').addEventListener('click', async () => {
      if (stickersData.length === 0) return alert('추출할 스티커가 없습니다.');
      
      const zip = new JSZip();
      loadingEl.style.display = 'flex';
      loadingEl.querySelector('div:last-child').innerText = 'ZIP 파일 생성 중...';

      // Re-draw clean image without bounding box lines
      showBoxes = false;
      drawPreview();

      // Create a temporary canvas to extract each sticker
      const tempCanvas = document.createElement('canvas');
      const tCtx = tempCanvas.getContext('2d');

      let count = 1;
      for (const box of stickersData) {
        tempCanvas.width = box.w;
        tempCanvas.height = box.h;
        tCtx.clearRect(0, 0, box.w, box.h);
        tCtx.drawImage(mainCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
        
        // Convert to blob
        const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/png'));
        zip.file(`sticker_${count.toString().padStart(3, '0')}.png`, blob);
        count++;
      }

      // Restore preview
      showBoxes = true;
      drawPreview();

      // Download
      zip.generateAsync({type:"blob"}).then(function(content) {
        saveAs(content, "setupod_stickers.zip");
        loadingEl.style.display = 'none';
        loadingEl.querySelector('div:last-child').innerText = '스티커 테두리 분석 중...';
      });
    });
  </script>
</body>
</html>
