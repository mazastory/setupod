<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-67QE5VV6XR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-67QE5VV6XR');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SETUPOD Studio | 바이럴 웨이트리스트 생성기</title>
  <meta name="description" content="SETUPOD - 카카오톡, 인스타그램, 3D 명함까지 한 번에 셋업하는 올인원 비즈니스 자산 플랫폼">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.344.0"></script>

  <style>
    :root {
      --bg: #070510;
      --panel: #110c22;
      --border: rgba(255, 255, 255, 0.1);
      --violet: #8b5cf6;
      --cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar { width: 450px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    .sidebar-header h1 { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 900; color: var(--cyan); margin-bottom: 4px; }
    .scroll-area { flex: 1; overflow-y: auto; padding: 24px; }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    .form-input, .form-textarea { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: #fff; font-family: inherit; font-size: 14px; }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2); }
    .form-textarea { height: 80px; resize: none; }
    .section-title { font-size: 15px; font-weight: 800; margin: 32px 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

    .sidebar-footer { padding: 24px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border); }
    .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--cyan), #0284c7); border: none; border-radius: 14px; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(6, 182, 212, 0.4); }

    .preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, #1a162d 0%, #070510 100%); padding: 40px; }
    .device-mockup { width: 375px; height: 812px; background: #0d0b14; border-radius: 40px; border: 8px solid #2a253c; box-shadow: 0 40px 80px rgba(0,0,0,0.5); position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .device-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 25px; background: #2a253c; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; z-index: 10; }
    .preview-iframe { width: 100%; height: 100%; border: none; background: #000; }
    
    .link-box { margin-top: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 99px; display: flex; align-items: center; gap: 12px; }
    .link-text { font-family: monospace; color: var(--violet); }
    .btn-icon { background: none; border: none; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>웨이트리스트 스튜디오</h1>
      <p style="font-size:12px; color:rgba(255,255,255,0.5);">출시 전 이메일을 수집하고 바이럴을 만드세요.</p>
    </div>

    <div class="scroll-area" id="configForm">
      <div class="section-title"><i data-lucide="layout-template" style="width:16px;"></i> 메인 텍스트 설정</div>
      <div class="form-group">
        <label class="form-label">프로젝트 이름 (배지)</label>
        <input type="text" id="cfgBadge" class="form-input" value="SECRET PROJECT" oninput="saveAndPreview()">
      </div>
      <div class="form-group">
        <label class="form-label">메인 헤드라인</label>
        <textarea id="cfgTitle" class="form-textarea" oninput="saveAndPreview()">상위 1% 마케터들의 비밀 무기, 곧 공개됩니다.</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">서브 설명</label>
        <input type="text" id="cfgDesc" class="form-input" value="이메일을 남기고 가장 먼저 초대장을 받으세요." oninput="saveAndPreview()">
      </div>

      <div class="section-title"><i data-lucide="share-2" style="width:16px;"></i> 바이럴 루프 설정 (공유 시 혜택)</div>
      <div class="form-group">
        <label class="form-label">리워드(혜택) 이름</label>
        <input type="text" id="cfgReward" class="form-input" value="고수익 자동화 템플릿 팩" oninput="saveAndPreview()">
      </div>
      <div class="form-group">
        <label class="form-label">필요한 초대 인원</label>
        <input type="number" id="cfgReqCount" class="form-input" value="3" oninput="saveAndPreview()">
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-primary" onclick="publishTest()">
        <i data-lucide="rocket" style="width:18px;"></i> 웨이트리스트 오픈하기
      </button>
    </div>
  </aside>

  <main class="preview-area">
    <div class="device-mockup">
      <div class="device-notch"></div>
      <iframe id="previewFrame" class="preview-iframe" src="waitlist.html?preview=true"></iframe>
    </div>
    <div class="link-box">
      <span class="link-text" id="publishedLink">페이지를 오픈하면 링크가 생성됩니다.</span>
      <button class="btn-icon" onclick="copyLink()" title="링크 복사"><i data-lucide="copy" style="width:16px;"></i></button>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function saveAndPreview() {
      const data = {
        badge: document.getElementById('cfgBadge').value,
        title: document.getElementById('cfgTitle').value,
        desc: document.getElementById('cfgDesc').value,
        reward: document.getElementById('cfgReward').value,
        reqCount: parseInt(document.getElementById('cfgReqCount').value || "3")
      };
      
      localStorage.setItem('setupod_waitlist_cfg', JSON.stringify(data));
      
      const iframe = document.getElementById('previewFrame');
      if(iframe.contentWindow) iframe.contentWindow.postMessage('reload_waitlist', '*');
    }

    function publishTest() {
      saveAndPreview();
      const demoId = Math.random().toString(36).substring(2, 8);
      const url = `https://setupod.com/waitlist.html?id=${demoId}`;
      document.getElementById('publishedLink').innerText = url;
      alert("웨이트리스트 발행 성공!");
    }

    function copyLink() {
      const txt = document.getElementById('publishedLink').innerText;
      if(txt.includes('setupod.com')) {
        navigator.clipboard.writeText(txt);
        alert('링크가 복사되었습니다!');
      }
    }

    saveAndPreview();
  </script>
</body>
</html>
